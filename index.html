<html>
    <header>
        <title>Javascript Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </header>

    <body class="container d-flex justify-content-center align-items-center bg-dark">
        <div id = "quiz-container" class="card">

            <div class="card-header">
                <h1 id="question"></h1>
            </div>

            <div class="card-body">
                <div id="answers"></div>
            </div>

            <div class="card-footer">
            <button id="next-button" class="btn btn-primary" onclick = "nextQuestion()">Nächste Frage</button>
            </div>

        </div>

        <div id="result" hidden="true" class="card">

            <div class="card-header">
                <h1>Quiz beendet!</h1>
            </div>

            <div class="card-body">
                <p>Deine Punktezahl: <span id="score"></span></p>
            </div>

            <!-- <div class="card-footer">
            </div> -->
            
        </div>
    </body>

    <script src="quiz.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
